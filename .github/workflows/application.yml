
name: Deploy Flask Application to Private EC2

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Configure SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh

          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa

      - name: Configure Bastion and Private EC2
        env:
          BASTION_HOST: ${{ secrets.BASTION_HOST }}
          BASTION_USER: ${{ secrets.BASTION_USER }}
          PRIVATE_HOST: ${{ secrets.PRIVATE_HOST }}
          PRIVATE_USER: ${{ secrets.PRIVATE_USER }}
        run: |
          cat > ~/.ssh/config <<EOF
          Host bastion
            HostName $BASTION_HOST
            User $BASTION_USER
            IdentityFile ~/.ssh/id_rsa
            StrictHostKeyChecking accept-new

          Host private-server
            HostName $PRIVATE_HOST
            User $PRIVATE_USER
            ProxyJump bastion
            IdentityFile ~/.ssh/id_rsa
            StrictHostKeyChecking accept-new
          EOF

          chmod 600 ~/.ssh/config

      - name: Test Private EC2 Connection
        run: |
          ssh private-server "hostname && whoami"

      # Copy Flask application from GitHub runner
      # directly to Private EC2 through Bastion
      - name: Copy Application to Private EC2
        run: |
          ssh private-server "mkdir -p ~/flask-app"

          rsync -avz --delete \
            -e "ssh" \
            --exclude '.git' \
            --exclude 'venv' \
            ./ private-server:flask-app/

      # Install dependencies and run Flask on Private EC2
      - name: Deploy Flask on Private EC2
        run: |
          ssh private-server 'bash -s' <<'REMOTE'
            set -e

            echo "Deploying on Private EC2"

            APP_DIR="$HOME/flask-app"

            cd "$APP_DIR"

            sudo apt update
            sudo apt install -y python3 python3-pip python3-venv

            python3 -m venv venv

            ./venv/bin/pip install flask

            cat > app.py <<'PYTHON'
          from flask import Flask

          app = Flask(__name__)

          @app.route("/")
          def home():
              return "Flask deployed successfully on Private EC2!"

          @app.route("/health")
          def health():
              return {"status": "healthy"}

          if __name__ == "__main__":
              app.run(host="0.0.0.0", port=5000)
          PYTHON

            sudo tee /etc/systemd/system/flask-app.service > /dev/null <<EOF
          [Unit]
          Description=Flask Application
          After=network.target

          [Service]
          User=$(whoami)
          WorkingDirectory=$APP_DIR
          ExecStart=$APP_DIR/venv/bin/python $APP_DIR/app.py
          Restart=always

          [Install]
          WantedBy=multi-user.target
          EOF

            sudo systemctl daemon-reload
            sudo systemctl enable flask-app
            sudo systemctl restart flask-app

            sudo systemctl is-active flask-app

            echo "Flask deployed successfully on Private EC2"

          REMOTE


name: Deploy Flask App to Private EC2

on:
  push:
    branches:
      - main

  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      # Step 1: Checkout GitHub repository
      - name: Checkout Code
        uses: actions/checkout@v4

      # Step 2: Authenticate with AWS using OIDC
      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::583960588058:role/OICD-role
          aws-region: us-east-1

      # Step 3: Verify AWS authentication
      - name: Verify AWS Identity
        run: aws sts get-caller-identity

      # Step 4: Configure SSH
      - name: Configure SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
        run: |
          set -e

          mkdir -p ~/.ssh
          chmod 700 ~/.ssh

          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa

      # Step 5: Configure Bastion and Private EC2
      - name: Configure SSH Hosts
        env:
          BASTION_HOST: ${{ secrets.BASTION_HOST }}
          BASTION_USER: ${{ secrets.BASTION_USER }}
          PRIVATE_HOST: ${{ secrets.PRIVATE_HOST }}
          PRIVATE_USER: ${{ secrets.PRIVATE_USER }}
        run: |
          set -e

          cat > ~/.ssh/config <<EOF
          Host bastion
            HostName $BASTION_HOST
            User $BASTION_USER
            IdentityFile ~/.ssh/id_rsa
            StrictHostKeyChecking accept-new

          Host private-server
            HostName $PRIVATE_HOST
            User $PRIVATE_USER
            ProxyJump bastion
            IdentityFile ~/.ssh/id_rsa
            StrictHostKeyChecking accept-new
          EOF

          chmod 600 ~/.ssh/config

      # Step 6: Verify Bastion connection
      - name: Test Bastion Connection
        run: |
          ssh bastion "hostname"

      # Step 7: Verify Private EC2 connection
      - name: Test Private EC2 Connection
        run: |
          ssh private-server "hostname && whoami"

      # Step 8: Deploy Flask application on Private EC2
      - name: Deploy Flask Application
        run: |
          ssh private-server 'bash -s' <<'REMOTE'
            set -e

            echo "Connected to Private EC2 successfully"

            # Install Python requirements
            sudo apt update
            sudo apt install -y python3 python3-pip python3-venv

            # Create application directory
            mkdir -p ~/flask-app
            cd ~/flask-app

            # Create virtual environment
            python3 -m venv venv

            # Install Flask
            ./venv/bin/pip install flask

            # Create Flask application
            cat > app.py <<'PYTHON'
            from flask import Flask

            app = Flask(__name__)

            @app.route("/")
            def home():
                return "Hello! Flask Application Deployed Successfully using GitHub Actions!"

            @app.route("/health")
            def health():
                return {"status": "healthy"}

            if __name__ == "__main__":
                app.run(host="0.0.0.0", port=5000)
            PYTHON

            # Create systemd service
            sudo tee /etc/systemd/system/flask-app.service > /dev/null <<EOF
            [Unit]
            Description=Python Flask Application
            After=network.target

            [Service]
            User=$(whoami)
            WorkingDirectory=$HOME/flask-app
            ExecStart=$HOME/flask-app/venv/bin/python $HOME/flask-app/app.py
            Restart=always
            RestartSec=5

            [Install]
            WantedBy=multi-user.target
            EOF

            # Enable and restart Flask service
            sudo systemctl daemon-reload
            sudo systemctl enable flask-app
            sudo systemctl restart flask-app

            # Verify Flask service
            sudo systemctl is-active flask-app

            echo "Flask application deployed successfully!"

          REMOTE
